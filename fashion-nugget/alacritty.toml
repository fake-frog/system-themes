[window]
opacity = 1
dynamic_padding = true

[window.padding]
x = 10
y = 10

[font]
size = 12

[font.normal]
family = "lilex"
#family = "lilex"
style = "normal"

[font.offset]
y=0

[colors.primary]
background = '#f1ebe4'
foreground = '#555555'

[colors.cursor]
text   = '#f1ebe4'
cursor = '#6671b8'

[cursor]
#style = { shape = "Beam", blinking = "On" }
#thickness  = 0.2

[colors.selection]
text       = '#f1ebe4'
background = '#555555'

[colors.normal]
black   = '#f1ebe4'
red     = '#f666aa'
green   = '#dc8add'
yellow  = '#53997b'
blue    = '#555555'
magenta = '#f666aa'
cyan    = '#555555'
white   = '#555555'

[colors.bright]
black   = '#696262'
red     = '#f66151'
green   = '#dc8add'
yellow  = '#53997b'
blue    = '#252121'
magenta = '#f666aa'
cyan    = '#dababa'
white   = '#dababa'
